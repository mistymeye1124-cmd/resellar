version: '3.8'

services:
  bot:
    build: .
    container_name: reseller_telegram_bot
    restart: always
    env_file:
      - .env
    volumes:
      # Persistent database storage on VPS host
      - ./database:/app/database
      # Live bot log file
      - ./bot.log:/app/bot.log
    environment:
      - TZ=Asia/Dhaka
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
